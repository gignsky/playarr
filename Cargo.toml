[package]
authors = ["Maxwell Rupp <gignsky@gignsky.com>"]
edition = "2021"
# If you change the name here, you must also do it in flake.nix (and run `cargo generate-lockfile` afterwards)
name = "playarr"
description = "A Rust project using Nix that automatically downloads the next episode season of a show via sonarr when it is detected that a user is ending the currently downloaded season."
version = "0.6.0-dev"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
#args parser
clap = { version = "4.3.14", features = ["derive"] }
plex-api = "0.0.11"
serde = { version = "1.0.219", features = ["derive"] }
sonarr = "0.1.0"
toml = "0.8.22"
url = "2.5.4"

[package.metadata.scripts]
run = "cargo run"
check = "cargo check"
build = "cargo build"
release = "cargo build --release"
